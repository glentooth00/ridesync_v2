name: ridesync
description: Offline-first motorcycle companion app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  shared_preferences_android: 2.4.28
  geolocator: ^14.1.2
  wakelock_plus: ^1.8.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/ridesync_icon.png"
  adaptive_icon_background: "#151617"
  adaptive_icon_foreground: "assets/icons/ridesync_icon.png"